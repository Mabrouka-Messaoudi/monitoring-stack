# Accès externe à Loki et Tempo pour le collecteur de données AIOps
# (requêtes LogQL et TraceQL). Prometheus est exposé directement par ses values (30090).
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30003
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      nodePort: 30622

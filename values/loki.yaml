deploymentMode: SingleBinary

# ================================================================
# Loki — SingleBinary (PFE lab), upgrade path: distributed
# ================================================================
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 744h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

# ── Tolerations helper (reused across all components) ────────────
# All components that must land on the monitoring node need this
# toleration explicitly — the chart does NOT inherit it globally.

singleBinary:
  replicas: 1
  nodeSelector:
    monitoring: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 8Gi

# ── Memcached — results cache ─────────────────────────────────────
# Must explicitly tolerate the monitoring taint to land on worker1.
# Without this, scheduler rejects worker1 and worker2/3 have no RAM.
resultsCache:
  enabled: true
  nodeSelector:
    monitoring: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Memcached — chunks cache ──────────────────────────────────────
chunksCache:
  enabled: true
  nodeSelector:
    monitoring: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Promtail est installé séparément (chart grafana/promtail, values/promtail.yaml) :
# le chart grafana/loki ne contient pas de sous-chart Promtail.

# ── Gateway — disabled in SingleBinary mode ───────────────────────
gateway:
  enabled: false

# ── SimpleScalable targets — explicitly zeroed ───────────────────
# Prevents the chart validator from complaining about mixed modes.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# ── Self-monitoring — disabled for lab simplicity ────────────────
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# ================================================================
# Loki — mode single binary (lab), production: mode distributed
# ================================================================
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 744h   # 31 jours
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

singleBinary:
  replicas: 1
  nodeSelector:
    monitoring: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 8Gi

# Promtail — DaemonSet sur tous les nœuds
promtail:
  enabled: true
  tolerations:
    - operator: Exists
  config:
    clients:
      - url: http://loki-headless.monitoring.svc.cluster.local:3100/loki/api/v1/push

gateway:
  enabled: true
  nodeSelector:
    monitoring: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule

test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
